MODEL:
  ARCH: resnet50
  METHOD: difo
SETTING:
  DATASET: office-home
  S: 0
  T: 2
  SEED: 2020
  OUTPUT_SRC: source
OPTIM:
  METHOD: SGD
  MOMENTUM: 0.9
  LR: 0.01
  WD: 1e-3
  NESTEROV: TRUE
TEST:
  BATCH_SIZE: 64
  MAX_EPOCH: 15
  INTERVAL: 15
DIFO:
  CLS_PAR: 0.4
  EPSILON : 1e-5
  GENT_PAR: 1.0
  ARCH : ViT-B/32
  TTA_STEPS : 1
  CTX_INIT : a_photo_of_a
  N_CTX : 4
  LOAD : None
  IIC_PAR: 1.0
  GENT_PAR : 1.0
  MERGE_USE_OBSERVATION_PRIOR: 0
  MERGE_INITIAL_TARGET_WEIGHT: 0.1
  MERGE_PRIOR_DECAY: 2.0
  MERGE_CONFIDENCE_WEIGHT: 0.2
  MERGE_STABILITY_WEIGHT: 0.8
  MERGE_GATE_TEMPERATURE: 0.25
  MERGE_ROBUST_TEMPERATURE: 5.0
  MERGE_MIN_WEIGHT: 0.05
  # ---- adaptive-alpha 开关(消融实验,默认值=原行为) ----
  MERGE_USE_CONFIDENCE: 1     # 0=可靠性只用稳定性(消融#2)
  MERGE_USE_STABILITY: 1      # 0=可靠性只用置信度(消融#3)
  MERGE_USE_PRIOR_TERM: 1     # 0=去掉可靠性先验(消融#5)
  MERGE_USE_LOSS_GAP: 1       # 0=去掉loss gap(消融#4)
  MERGE_PRIOR_DIRECT: 0
  MERGE_FIXED_ALPHA: -1.0     # [0,1]=固定alpha
  MERGE_LOSS_GAP_CLAMP: 5.0
  MERGE_CLIP_USE_STABILITY: 0
